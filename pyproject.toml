[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "governance-measurement-harness"
version = "0.1.0"
description = "External measurement harness for the AI Compliance Runtime"
requires-python = ">=3.11"
dependencies = [
    "compliance-runtime",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*", "verifier*"]
